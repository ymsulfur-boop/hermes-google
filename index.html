<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes Gmail</title></head><body><main><h1>Hermes Gmail</h1><p>Hermes Gmail은 운영자 본인의 Google 계정을 Hermes 개인 비서와 연결하기 위한 개인용 도구입니다. 사용자가 승인한 권한 범위 안에서 메일과 캘린더를 활용해 요청한 업무, 일정 확인 및 알림을 지원합니다.</p><p>Google 계정 연동은 OAuth 인증을 이용합니다. 이 앱은 Google 또는 Nous Research의 공식 서비스가 아니라 운영자가 구성한 개인용 연동 앱입니다.</p><p>문의: ymsulfur@gmail.com</p><p><a href="privacy.html">개인정보처리방침</a></p></main></body></html>
